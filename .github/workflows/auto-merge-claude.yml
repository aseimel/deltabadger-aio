name: Auto-merge claude branches to main

on:
  push:
    branches: ['claude/**']

jobs:
  merge-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get branch name for merge commit message
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          git checkout main
          git pull origin main

          # Try fast-forward first (cleanest), fall back to regular merge if needed
          if git merge --ff-only ${{ github.sha }} 2>/dev/null; then
            echo "✓ Fast-forward merge successful"
          else
            echo "Fast-forward not possible, creating merge commit..."
            git merge --no-ff -m "Auto-merge ${BRANCH_NAME} to main" ${{ github.sha }}
          fi

          git push origin main

      - name: Trigger Docker build
        run: |
          gh workflow run build-aio.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
